# IQL/Bellman Stage B 冒烟配置（2026-10-15，对应计划 S-B1b）
# 目的：验证 objective='iql' 的训练端接线（iql 数据条目 → 三损失 → EMA/state 往返），2k 步内确认：
#   ① 暖启守卫与 "缺 v_net/EMA" 告警恰 1 条 ② 无 non-finite ③ q/v/awr 三损失曲线稳定
#   ④ 吞吐实测 ⑤ test_play 正常跑完 ⑥⑦ **行为门禁**：test_play avg_rank 未劣化、holdout top1 与
#     Q 幅度在合理带内（v1 只查结构性项目，未能拦下 r_t 双重计入缺陷，见 MEMORY §16.26）。
#     产物全部隔离在 *_smoke 命名空间。
# ★ 命名空间递增记录：v1（checkpoints/iql_b_smoke/）= r_t 双重计入缺陷版；v2（checkpoints/iql_b_smoke_v2/）
#   = r_t 已修但 L_V 错用「全部合法动作取 expectile」的版（末态 test_play avg_rank 2.840/avg_pt −26.54，
#   holdout top1 0.6975、logsumexp_q −33.59 → 行为门禁 FAIL）。两者均含受损权重，不可续用，
#   就地封存供取证；v3 = 两个缺陷都修完后的验证轮。
# 与正式 config.iql_b.toml 的差异：max_train_steps=758000（756k 暖启 + 2k 冒烟步）、
#   test_every/snapshot_every=2000（保证冒烟窗口内触发 test_play 与快照）、独立 ckpt/TB/test_play、
#   smoke 专属 reset 令牌；数据侧复用 B 组索引（manifest 校验通过即复用）。

[control]
version = 4
online = false
state_file = "checkpoints/iql_b_smoke_v3/mortal.pth"   # 启动前从 B 组 756k 暖启（脚本负责拷贝）
best_state_file = "checkpoints/iql_b_smoke_v3/best.pth"
tensorboard_dir = "runs/iql_b_smoke_v3"
device = "cuda:0"                # 物理卡由 CUDA_VISIBLE_DEVICES 指定（冒烟用 GPU2 RTX 8000）
enable_cudnn_benchmark = true
enable_amp = false               # 与正式一致：fp32
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 2000                # 冒烟窗口内必触发一次 test_play（758000 % 2000 == 0）
submit_every = 1000
max_train_steps = 758000         # ★ 暖启自带 steps=756000 → 实际只训练 2k 步（§14-33）
snapshot_every = 2000
seed = 20261015
reset_best_perf = "iql-b-smoke-v3"
reset_optimizer = "iql-b-smoke-v3"
objective = "iql"                # ★ 冒烟目标：iql 端到端
iql_tau = 0.7
iql_beta = 3.0
ema_decay = 0.995

[test_play]
games = 256                      # 冒烟：每次 test_play 只打 64 局
log_dir = "runs/iql_b_smoke_v3/test_play"
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
# 与 B 组完全一致 → manifest 校验通过，索引直接复用
globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
player_names_files = [ "../dataset/index/top_players_400_v2.txt",]
file_index = "indexes/reward_ablation_r4_v2.pth"
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true
augmented_first = true
data_version = "reward-ablation-r4-v2"

[env]
gamma = 0.997                    # ★ iql：每决策步折扣
pts = [ 2.0, 1.0, 0.0, -3.0,]    # B 口径
reward_mode = "rank_pt"
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5                 # iql 下不生效，占位

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [ 0.9, 0.999,]
weight_decay = 0.1
max_grad_norm = 5.0

[online]
history_window = 50
enable_compile = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = "runs/iql_b_smoke_v3/ladder"

[1v3.challenger]
device = "cuda:0"
name = "mortal"
state_file = "checkpoints/iql_b_smoke_v3/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = "cuda:0"
name = "baseline"
state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = "/path/to/akochan"
tactics = "/path/to/tactics.json"

[1v3.ladder]
device = "cuda:0"
enable_amp = false
enable_rule_based_agari_guard = true

[grp]
state_file = "checkpoints/grp_h128.pth"

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = "cuda:0"
enable_cudnn_benchmark = true
tensorboard_dir = "runs/grp_v2"
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.dataset]
train_globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
val_globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz",]
file_index = "indexes/grp_recent_v1.pth"
file_batch_size = 50

[grp.optim]
lr = 0.0001

[train_play.default]
games = 800
log_dir = "runs/train_play"
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[optim.scheduler]
peak = 0.0001
final = 0.0001
warm_up_steps = 2000
max_steps = 2000

[baseline.train]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[baseline.test]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[online.remote]
host = "127.0.0.1"
port = 5000

[online.server]
buffer_dir = "/path/to/buffer"
drain_dir = "/path/to/drain"
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false
