# 数据扩窗探针 D1（2026-10-24）：B/756k 暖启 + 现窗口混入 2019-2021 的 20%
# 单变量：只加旧年份数据（按年代名单过滤 + 文件名 sha1 抽 20%），obs/奖励/超参全部同 B
#
# 唯一实质变量（vs B 组 checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth, 756k）：
#   ★ S6c 特征注入：extra_features = ''（自家向听/8 + 实战有效牌数/136，34 列广播）
#   → 首层 Conv1d 1012 → 1014（新通道零初始化，暖启瞬间与 B 组逐位等价）
# 其它全部沿用 B/756k 口径：pts [2,1,0,-3]、top400_v2、2022-2026H1 训练窗、
# batch 512、fp32（§16.20 AMP 事故后保持关闭）、seed 20261012。
#
# 判据（README §13.16）：
#   1) 暖启 ckpt 的 holdout 必须与 B/756k 完全一致（管线透明）
#   2) 20k 探针（config.s6c_probe.toml）：holdout top1 ≥ 0.8223 + 首层新通道被使用
#   3) 200k 正式轮后：holdout 不退 + 双向 5000 sets ladder（λ=0 隔离模型变量）
#
# 运行（tmux 承载）：bash run_s6c.sh formal  /  bash run_s6c.sh probe / ladder

[control]
version = 4
online = false
state_file = 'checkpoints/mix_v1/mortal.pth'          # 启动前由 expand_ckpt_v6.py 从 B/756k 手术生成
best_state_file = 'checkpoints/mix_v1/best.pth'
tensorboard_dir = 'runs/main_mix_v1'
device = 'cuda:0'                # 物理卡由 CUDA_VISIBLE_DEVICES 指定（训练用 GPU2 RTX 8000）
enable_cudnn_benchmark = true
enable_amp = false               # 与 B 组一致（fp32）
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 856000         # 756k + 100k（探针预算）
snapshot_every = 20000
seed = 20261012
# 一次性令牌：首层手术后必须丢弃父代 optimizer/scheduler（形状不匹配 + 动量口径不同）
# 暖启沿用 B 的 optimizer（与 R2→R3→R4→R5 一致；形状未变，不需要重置）
reset_best_perf = 'mix-v1'
# S6c 已关闭（判无结论）：本实验只改数据，obs 仍 1012
extra_features = ''

[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 2000
log_dir = 'runs/selection_mix_v1'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
    # 扩窗：2019-2021（按比例混入，抽样规则见 tools/data_audit/build_mix_index.py）
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/2019??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[01]??/**/*.json.gz',
]
player_names_files = [
    '../dataset/index/top_players_400_v2.txt',          # 现窗口（2022-2026H1）沿用
    '../dataset/index/top_players_400_2019_2021.txt',   # 旧年份年代名单（自建）
]
file_index = 'indexes/data_mix_2019_2021_20pct_v1.pth'
data_version = 'data-mix-2019-2021-20pct-v1'
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true      # 与 B 组一致；增强样本的 S6c 特征按增强后的 obs 重算
augmented_first = true

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]    # B 口径：对齐天凤点数（第 4 名重罚）
reward_mode = 'rank_pt'
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false                  # 离线 false；未来在线必须 true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000                # 暖启后恒定 1e-4（reset_optimizer 后重新 warmup 2k 步）

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'   # 与 B 组一致，best_perf 可比

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = 'runs/1v3_mix_v1'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'checkpoints/mix_v1/mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'checkpoints/mortal_step_000200000.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.ladder]
device = 'cuda:0'
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_v2'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.dataset]
train_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
    # 扩窗：2019-2021（按比例混入，抽样规则见 tools/data_audit/build_mix_index.py）
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/2019??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[01]??/**/*.json.gz',
]
val_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz',
]
file_index = 'indexes/grp_recent_v1.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-4
