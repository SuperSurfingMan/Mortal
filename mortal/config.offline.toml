# This is only an example. Most values are dummy placeholders just to match the
# types; they are often not optimal and must be tuned.

[control]
version = 4
online = false
state_file = 'checkpoints/mortal.pth'
best_state_file = 'checkpoints/best.pth'
tensorboard_dir = 'runs/main'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = true
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 200000        # 需 §4.2 代码修改
snapshot_every = 50000          # 需 §4.2 代码修改

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
games = 800
log_dir = '/path/to/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 2000                    # 每 50000 步的周期评测规模（快速选择用）
log_dir = 'runs/selection'
enable_amp = false              # 需 §4.1 代码修改后生效
enable_rule_based_agari_guard = true


[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
file_index = 'indexes/main_recent_v1.pth'
file_batch_size = 8
reserve_ratio = 0.0
num_workers = 2
player_names_files = []
num_epochs = 1
enable_augmentation = false
augmented_first = false

[env]
gamma = 1
pts = [6.0, 4.0, 2.0, 0.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false                  # 离线保持 false；未来在线必须 true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0             # 由默认 0 改为 5.0，增加稳定性缓冲

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000            # 2000 步线性 warm-up
max_steps = 2000                # 之后恒定 1e-4，不用余弦衰减

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/baseline.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/baseline.pth'

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = '/path/to/1v3'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = '/path/to/challenger.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = '/path/to/baseline.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'checkpoints/grp.pth'

[grp.network]
hidden_size = 64
num_layers = 2

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 30000         # 需 §4.3 代码修改

[grp.dataset]
train_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
val_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz',
]
file_index = 'indexes/grp_recent_v1.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-4                       # 从零训练起点；val_loss 持续恶化则降 1e-5