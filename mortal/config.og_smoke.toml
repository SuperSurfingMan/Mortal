# Oracle Guiding 1k 冒烟（2026-11-03）：S6c/956k 暖启 + 训练期注入三家暗牌并退火
#
# 机制：invisible_obs（oracle_obs_shape(4) = 217 行）按 α 缩放后拼进首层；
#       α: 1.0 保持 10k 步 → 线性退到 0（50k 步）→ 之后 50k 步 α=0。
#       推理时 engine 自动喂全零，不读取任何暗牌。
# 父代：checkpoints/s6c/mortal.pth（956k，S6c/956k）
# 手术：python tools/expand_ckpt_oracle.py checkpoints/s6c/mortal.pth checkpoints/og/mortal.pth
# 门禁（预注册）：
#   1) 手术透明性：α=0 暖启瞬间 holdout top1 与 S6c/956k 完全一致
#   2) 1k 冒烟：α=0 时 holdout top1 不退（−0.3pp 内）、dqn_loss ≤ +2%
#   3) 只有 2) 过，才上 16k 标准臂（δ_min≈0.66）；若只有 +0.3 级，写"未决"而非"转正"
#
# 运行（tmux 承载，GPU2）：bash run_og.sh smoke|probe|all

[control]
version = 4
online = false
state_file = 'checkpoints/og_smoke/mortal.pth'           # 启动前由 tools/expand_ckpt_oracle.py 手术生成
best_state_file = 'checkpoints/og_smoke/best.pth'
tensorboard_dir = 'runs/og_smoke'
device = 'cuda:0'                # 物理卡由 CUDA_VISIBLE_DEVICES 指定（训练用 GPU2 RTX 8000）
enable_cudnn_benchmark = true
enable_amp = false               # 与 B 组一致（fp32）
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 1000000         # 冒烟不触发 test_play
submit_every = 1000
max_train_steps = 957000         # 956k + 1k（冒烟）
snapshot_every = 20000
seed = 20261103
# 一次性令牌：首层手术后必须丢弃父代 optimizer/scheduler（形状不匹配 + 动量口径不同）
reset_optimizer = 'og-v1'
reset_best_perf = 'og-v1'
# ★ S6c：obs 尾部注入的特征族（'' = 关闭；行数由 s6c_features.resolve 推导为 2）
extra_features = 's6c'

# ★ Oracle Guiding：训练期注入隐藏信息并按 α 退火；推理 α=0（engine 喂全零）
[oracle_guiding]
enabled = true
alpha_start = 1.0
alpha_end = 0.0
warmup_steps = 10000
anneal_steps = 50000

[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 2000
log_dir = 'runs/selection_s6c'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
player_names_files = ['../dataset/index/top_players_400_v2.txt']
file_index = 'indexes/reward_ablation_r4_v2.pth'   # 与 B/756k 同一份文件表（数据未变）
data_version = 'reward-ablation-r4-v2'
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true      # 与 B 组一致；增强样本的 S6c 特征按增强后的 obs 重算
augmented_first = true

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]    # B 口径：对齐天凤点数（第 4 名重罚）
reward_mode = 'rank_pt'
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false                  # 离线 false；未来在线必须 true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000                # 暖启后恒定 1e-4（reset_optimizer 后重新 warmup 2k 步）

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'   # 与 B 组一致，best_perf 可比

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = 'runs/1v3_s6c'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'checkpoints/s6c/mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'checkpoints/mortal_step_000200000.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.ladder]
device = 'cuda:0'
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_v2'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.dataset]
train_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
val_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz',
]
file_index = 'indexes/grp_recent_v1.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-4
