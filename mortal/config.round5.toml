# Mortal 第 5 轮离线训练配置（10-13：B 口径奖励 + top200_v3 名单 + 修复后数据管线）
# 唯一实质变量（vs B 组控制）：数据选择从 top400_v2 收紧到 top200_v3（含 names 修复后的 2026 训练窗）
# ladder 判定：R5 vs B 组（checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth, 756k）
#
# 相对 B 组（reward_ablation/B_rank_pt_aligned/config.toml）的改动（★ 标注）：
#   ★1 名单：top_players_400_v2 → top_players_200_v3（v3 榜单已包含 2026 修复后的玩家）
#   ★2 数据：2026 部分从原始树（无 names，白名单 0 席位）换到修复补丁树 houou4_names
#   ★3 索引：换新名 + 新 data_version（manifest 自动失效旧索引）
#   ★4 预算：756k → 870k（top200 席位 344,068 ≈ 114k 步/遍，一次增强遍）
#   ★5 暖启：从 B 组 756k 继承（同奖励口径，optimizer 不重置——与 R2→R3→R4 一致）

[control]
version = 4
online = false
state_file = 'checkpoints/round5/mortal.pth'      # 启动前从 B 组 756k 暖启
best_state_file = 'checkpoints/round5/best.pth'
tensorboard_dir = 'runs/main_r5'
device = 'cuda:0'                # 物理卡由 CUDA_VISIBLE_DEVICES 指定：R5 训练用 GPU2 的 RTX 8000（fp32 4.28 it/s，R4 同卡实测）
enable_cudnn_benchmark = true
enable_amp = false      # R4 NaN 事故后保持 fp32（MEMORY §16.20）
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 870000        # 756k + ~114k = top200 增强样本一遍
snapshot_every = 50000

# using env `TRAIN_PLAY_PROFILE`
[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 2000
log_dir = 'runs/selection_r5'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',       # ★2 HF 历史（自带 names）
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4_names/20260[1-8]/**/*.json.gz', # ★2 修复后的 2026 训练窗
]
# ★1 v3 名单（build_whitelist.sh v3 口径产出，含 2026 修复后玩家）
player_names_files = ['../dataset/index/top_players_200_v3.txt']
file_index = 'indexes/main_r5_top200_v3.pth'   # ★3 新管线必须换新名
data_version = 'r5-top200-v3-names-fix'         # ★3
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true      # 与 B 组一致
augmented_first = true          # 先吃增强样本

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]    # B 口径：对齐天凤点数（第 4 名重罚）
reward_mode = 'rank_pt'
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false                  # 离线 false；未来在线必须 true

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000                # 暖启后恒定 1e-4

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'   # 与 B 组一致，best_perf 可比

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = 'runs/1v3_r5'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'checkpoints/round5/mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'checkpoints/mortal_step_000200000.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.ladder]
device = 'cuda:0'
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_v2'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000                           # 已训完；再次启动会继续加训

[grp.dataset]
train_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
val_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz',
]
file_index = 'indexes/grp_recent_v1.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-4
