# S6b 探针 A2：安慰剂臂（同 A1，但 danger 特征在文件批内跨文件全局置换）。
# 目的：排除「多 2 行参数/容量」本身，A1−A2 的差才是信息效应。
[control]
version = 4
online = false
state_file = 'checkpoints/inject_s6b/A2.pth'
best_state_file = 'checkpoints/inject_s6b/A2_best.pth'
tensorboard_dir = 'runs/s6b_a2'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 2000
test_every = 788000
submit_every = 1000
max_train_steps = 776000
snapshot_every = 788000
extra_channels = 2
reset_optimizer = 's6b-a2'
reset_best_perf = 's6b-a2'
seed = 20261022

[test_play]
games = 2000
log_dir = 'runs/selection_s6b_a2'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = ['/mnt/data8/mortal/Mortal/dataset/mjai/houou4_names/20260[1-8]/**/*.json.gz']
player_names_files = ['../dataset/index/top_players_400.txt']
file_index = 'indexes/s6b_a_v1.pth'
file_batch_size = 8
reserve_ratio = 0.0
num_workers = 4
num_epochs = 1
enable_augmentation = false
augmented_first = false
danger_dir = 'danger_cache'
danger_placebo = true
danger_turn_min = 0

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_h128'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth'

[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1
