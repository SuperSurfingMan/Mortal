# S6b 注入冒烟配置（2026-10-22）——只用于验证「预计算特征 → dataloader concat →
# 首层手术 ckpt → 2 步训练」的链路。正式 A1/A2/A3 探针另立 config。
#
# 与 B/756k 基线的差异（单变量）：
#   1) control.extra_channels = 2（obs 1012 → 1014）
#   2) control.state_file = inject_s6b/B756k_v6_init.pth（首层零初始化手术）
#   3) dataset.danger_dir = danger_cache_smoke（500 文件预计算；未覆盖的置零）
#   4) max_train_steps = 756010（父代 756k + 10 步；绝对步数，见坑 33）

[control]
version = 4
online = false
state_file = 'checkpoints/inject_s6b/B756k_v6_init.pth'
best_state_file = 'checkpoints/inject_s6b/smoke_best.pth'
tensorboard_dir = 'runs/s6b_smoke'
device = 'cuda:0'
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 10
test_every = 1000000
submit_every = 1000
max_train_steps = 756010
snapshot_every = 1000000
extra_channels = 2
# 首层手术新增 2 通道 → 父代 optimizer 动量形状不匹配（1012 vs 1014），
# 必须显式重置 optimizer（与 ckpt 内 optimizer_reset_token 不同即触发跳过加载）
reset_optimizer = 's6b-v1'
reset_best_perf = 's6b-v1'
seed = 20261022

[test_play]
games = 2000
log_dir = 'runs/selection_s6b'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4_names/202601/**/*.json.gz',
]
player_names_files = ['../dataset/index/top_players_400.txt']
file_index = 'indexes/s6b_smoke_jan_names_v1.pth'
file_batch_size = 4
reserve_ratio = 0.0
num_workers = 2
num_epochs = 1
enable_augmentation = false
augmented_first = false
danger_dir = 'danger_cache_smoke_jan'

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_h128'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth'

[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1
