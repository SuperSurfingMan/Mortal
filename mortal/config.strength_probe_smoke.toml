# 数据质量加权探针——2k 步冒烟版（由 config.strength_probe.toml 生成，2026-11-02）：S6c/956k 暖启 + 局内 4 人强度加权
#
# 唯一实质变量（vs S6c/956k）：
#   ★ [dataset.strength_weight]：按每局 4 名玩家的长期 avg_pt 取最弱一席（min），
#     按分位 [0.5,0.75,0.9] 分档重复 [1,1,2,3]（mean≈1.35），只扩 file_list，
#     不改损失、不动 file_index manifest；所有文件至少 1 次，不过滤。
#   权重表由 tools/training/build_strength_weights.py 离线生成（min_games>=100）。
# 其它全部沿用 S6c 口径：pts [2,1,0,-3]、top400_v2、2022-2026H1、batch 512、fp32。
#
# 判据（探针门禁）：
#   1) holdout（202609，digest 9c5362bf）top1 不掉 >0.5pp（基线 0.8167）
#   2) dqn_loss 不变差（基线 0.3613，容忍 +1%）
#   3) 行为画像（agari/houjuu/fuuro/riichi）不劣化
#   （冒烟版只验证加权管线：预算 958k=956k+2k，不产出判定）
#
# 运行（tmux 承载）：MORTAL_CFG=config.strength_probe.toml python -u train.py
#                  → 之后 MORTAL_CFG=config.strength_probe.toml python -u holdout_metrics.py <ckpt>

[control]
version = 4
online = false
state_file = 'checkpoints/strength_probe_smoke/mortal.pth'   # 启动前从 checkpoints/s6c/mortal.pth 复制
best_state_file = 'checkpoints/strength_probe_smoke/best.pth'
tensorboard_dir = 'runs/strength_probe_smoke'
device = 'cuda:0'                # 物理卡由 CUDA_VISIBLE_DEVICES 指定（训练用 GPU2 RTX 8000）
enable_cudnn_benchmark = true
enable_amp = false               # 与 S6c 一致（fp32）
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 958000        # S6c 956k + 100k
snapshot_every = 20000
seed = 20261012
# 一次性令牌：换数据分布 → 丢弃父代 optimizer（保留权重）
reset_optimizer = 'strength-smoke-v1'
reset_best_perf = 'strength-smoke-v1'
extra_features = 's6c'

[train_play.default]
games = 800
log_dir = 'runs/train_play'
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[test_play]
games = 2000
log_dir = 'runs/selection_strength_smoke'
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
player_names_files = ['../dataset/index/top_players_400_v2.txt']
file_index = 'indexes/reward_ablation_r4_v2.pth'   # 与 S6c 同一份文件表（只改采样权重）
data_version = 'reward-ablation-r4-v2'
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true
augmented_first = true

# ★ 数据质量加权：train.py 在 file_list 构建完成后按 repeats 扩增
[dataset.strength_weight]
table = 'indexes/strength_weights_v1.pth'
max_repeat = 3

[env]
gamma = 1
pts = [2.0, 1.0, 0.0, -3.0]
reward_mode = 'rank_pt'
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000

[baseline.train]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'

[baseline.test]
device = 'cuda:0'
enable_compile = false
state_file = 'checkpoints/mortal_step_000200000.pth'

[online]
history_window = 50
enable_compile = false

[online.remote]
host = '127.0.0.1'
port = 5000

[online.server]
buffer_dir = '/path/to/buffer'
drain_dir = '/path/to/drain'
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = 'runs/1v3_strength_smoke'

[1v3.challenger]
device = 'cuda:0'
name = 'mortal'
state_file = 'checkpoints/strength_probe_smoke/mortal.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = 'cuda:0'
name = 'baseline'
state_file = 'checkpoints/mortal_step_000200000.pth'
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.ladder]
device = 'cuda:0'
enable_amp = false
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = '/path/to/akochan'
tactics = '/path/to/tactics.json'

[grp]
state_file = 'checkpoints/grp_h128.pth'

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = 'cuda:0'
enable_cudnn_benchmark = true
tensorboard_dir = 'runs/grp_v2'
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.dataset]
train_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz',
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz',
]
val_globs = [
    '/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz',
]
file_index = 'indexes/grp_recent_v1.pth'
file_batch_size = 50

[grp.optim]
lr = 1e-4
