[control]
version = 4
online = false
state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth"
best_state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/best.pth"
tensorboard_dir = "runs/reward_ablation/B_rank_pt_aligned"
device = "cuda:0"
enable_cudnn_benchmark = true
enable_amp = false
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 756000
snapshot_every = 50000
seed = 20261012
reset_best_perf = "reward-ablation-v1"
reset_optimizer = "reward-ablation-v1"

[test_play]
games = 2000
log_dir = "runs/reward_ablation/B_rank_pt_aligned/test_play"
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
player_names_files = [ "../dataset/index/top_players_400_v2.txt",]
file_index = "indexes/reward_ablation_r4_v2.pth"
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true
augmented_first = true
data_version = "reward-ablation-r4-v2"

[env]
gamma = 1
pts = [ 2.0, 1.0, 0.0, -3.0,]
reward_mode = "rank_pt"
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[cql]
min_q_weight = 5

[aux]
next_rank_weight = 0.2

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [ 0.9, 0.999,]
weight_decay = 0.1
max_grad_norm = 5.0

[online]
history_window = 50
enable_compile = false

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = "runs/reward_ablation/B_rank_pt_aligned/ladder"

[grp]
state_file = "checkpoints/grp_h128.pth"

[train_play.default]
games = 800
log_dir = "runs/train_play"
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[optim.scheduler]
peak = 0.0001
final = 0.0001
warm_up_steps = 2000
max_steps = 2000

[baseline.train]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[baseline.test]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[online.remote]
host = "127.0.0.1"
port = 5000

[online.server]
buffer_dir = "/path/to/buffer"
drain_dir = "/path/to/drain"
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[1v3.challenger]
device = "cuda:0"
name = "mortal"
state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = "cuda:0"
name = "baseline"
state_file = "checkpoints/round4/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = "/path/to/akochan"
tactics = "/path/to/tactics.json"

[1v3.ladder]
device = "cuda:0"
enable_amp = false
enable_rule_based_agari_guard = true

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = "cuda:0"
enable_cudnn_benchmark = true
tensorboard_dir = "runs/grp_v2"
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.dataset]
train_globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
val_globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202609/**/*.json.gz",]
file_index = "indexes/grp_recent_v1.pth"
file_batch_size = 50

[grp.optim]
lr = 0.0001
