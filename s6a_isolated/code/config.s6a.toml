# S6a 正式轮（2026-10-17，会话 29）：读牌×主模型结合的第一步——**紧迫度特征注入**。
#   与 B/756k 的唯一实质变量：version 4 -> 5（obs 1012 -> 1018，尾部 6 行确定性特征）：
#     行 0..3  与排序后 1/2/3/4 名的点差 d_k（符号模式即当前顺位）
#     行 4     overtake_gap = 紧邻上位者分数 - 自家
#     行 5     lead_gap     = 自家 - 紧邻下位者分数
#   零假设（不做剩余局归一化：实测牌局长度 6~11 局不等，见 tools/training/test_urgency_features.py）
#   设计依据见 memory/NEXT_STEPS_ANALYSIS_20261012.md §4bis；数据/奖励/GRP/增强 = B 全锁死。
#   首层 conv 由 expand_ckpt_v5.py 从 B/756k 手术生成（新通道零初始化，等价于原模型 + 新特征从零学起）。

[control]
version = 5
online = false
state_file = "checkpoints/s6a/mortal.pth"        # 启动前由 expand_ckpt_v5.py 从 B/756k 手术生成
best_state_file = "checkpoints/s6a/best.pth"
tensorboard_dir = "runs/s6a"
device = "cuda:0"                # 物理卡由 CUDA_VISIBLE_DEVICES 指定：GPU2 RTX 8000
enable_cudnn_benchmark = true
enable_amp = false               # fp32
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 50000
submit_every = 1000
max_train_steps = 867000         # 756k + ~111k（同 B/v3 的预算，保证对照公平）
snapshot_every = 50000
seed = 20261017
reset_best_perf = "s6a-v1"       # 输入口径变更 -> 一次性重置 best_perf 竞争
reset_optimizer = "s6a-v1"       # 只继承模型权重，跳过旧优化器动量（§14-33 纪律）

[test_play]
games = 2000
log_dir = "runs/s6a/test_play"
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
player_names_files = [ "/mnt/data8/mortal/Mortal/dataset/index/top_players_400_v2.txt",]
file_index = "indexes/s6a_r4_v2.pth"   # 与 B 同数据集合（manifest 校验通过即复用）
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true
augmented_first = true
data_version = "s6a-r4-v2"

[env]
gamma = 1                        # 与 B 一致（cql_mc 局内 MC）
pts = [ 2.0, 1.0, 0.0, -3.0,]    # B 口径
reward_mode = "rank_pt"
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[grp]
state_file = "checkpoints/grp_h128.pth"

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = "cuda:0"
enable_cudnn_benchmark = true
tensorboard_dir = "runs/grp_v2"
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.optim]
lr = 1e-4

[aux]
next_rank_weight = 0.2

[cql]
min_q_weight = 5

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000                 # 暖启后恒定 1e-4（与 B 一致）

[online]
history_window = 50
enable_compile = false

[online.remote]
host = "127.0.0.1"
port = 5000

[online.server]
buffer_dir = "/path/to/buffer"
drain_dir = "/path/to/drain"
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[train_play.default]
games = 800
log_dir = "runs/train_play"
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[baseline.train]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[baseline.test]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = "runs/s6a/ladder"

[1v3.challenger]
device = "cuda:0"
name = "mortal"
state_file = "checkpoints/s6a/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = "cuda:0"
name = "baseline"
state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = "/path/to/akochan"
tactics = "/path/to/tactics.json"

[1v3.ladder]
device = "cuda:0"
enable_amp = false
enable_rule_based_agari_guard = true
