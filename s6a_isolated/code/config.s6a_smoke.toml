# S6a 冒烟配置（2026-10-17）：B/756k 暖启 + version=5（v4 + 6 行紧迫度特征）+ 2k 步结构性/行为门禁。
# 与正式 config.s6a.toml 的差异：max_train_steps=758000（暖启自带 756000，实际训 2k 步，§14-33）、
#   test_every/snapshot_every=2000（冒烟窗内必触发）、test_play 只打 256 局、独立 ckpt/TB/test_play。
# 数据侧与 B 组完全一致 → manifest 校验通过，索引直接复用。

[control]
version = 5                      # ★ 唯一实质变量：obs 1012 -> 1018（尾部 6 行紧迫度特征）
online = false
state_file = "checkpoints/s6a_smoke/mortal.pth"      # 启动前由 expand_ckpt_v5.py 从 B/756k 手术生成
best_state_file = "checkpoints/s6a_smoke/best.pth"
tensorboard_dir = "runs/s6a_smoke"
device = "cuda:0"                # 物理卡由 CUDA_VISIBLE_DEVICES 指定（冒烟用 GPU2 RTX 8000）
enable_cudnn_benchmark = true
enable_amp = false               # fp32（R4 NaN 事故后既定纪律）
enable_compile = false
batch_size = 512
opt_step_every = 1
save_every = 1000
test_every = 2000                # 冒烟窗口内必触发一次 test_play（758000 % 2000 == 0）
submit_every = 1000
max_train_steps = 758000         # ★ 暖启自带 steps=756000 → 实际只训练 2k 步
snapshot_every = 2000
seed = 20261017
reset_best_perf = "s6a-smoke-v1"
reset_optimizer = "s6a-smoke-v1"

[test_play]
games = 256
log_dir = "runs/s6a_smoke/test_play"
enable_amp = false
enable_rule_based_agari_guard = true

[dataset]
globs = [ "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/202[2-5]??/**/*.json.gz", "/mnt/data8/mortal/Mortal/dataset/mjai/houou4/20260[1-8]/**/*.json.gz",]
player_names_files = [ "/mnt/data8/mortal/Mortal/dataset/index/top_players_400_v2.txt",]
file_index = "indexes/s6a_r4_v2.pth"   # 与 B 同数据集合，manifest 校验通过即复用
file_batch_size = 16
reserve_ratio = 0.0
num_workers = 8
num_epochs = 1
enable_augmentation = true
augmented_first = true
data_version = "s6a-r4-v2"

[env]
gamma = 1                        # 与 B 一致（cql_mc：局内 MC，steps_to_done 折扣 ≡ 1）
pts = [ 2.0, 1.0, 0.0, -3.0,]    # B 口径
reward_mode = "rank_pt"
reward_scale = 1.0

[resnet]
conv_channels = 192
num_blocks = 40

[grp]
state_file = "checkpoints/grp_h128.pth"

[grp.network]
hidden_size = 128
num_layers = 3

[grp.control]
device = "cuda:0"
enable_cudnn_benchmark = true
tensorboard_dir = "runs/grp_v2"
batch_size = 512
save_every = 2000
val_steps = 200
max_train_steps = 60000

[grp.optim]
lr = 1e-4

[aux]
next_rank_weight = 0.2

[cql]
min_q_weight = 5

[freeze_bn]
mortal = false

[optim]
eps = 1e-8
betas = [0.9, 0.999]
weight_decay = 0.1
max_grad_norm = 5.0

[optim.scheduler]
peak = 1e-4
final = 1e-4
warm_up_steps = 2000
max_steps = 2000

[online]
history_window = 50
enable_compile = false

[online.remote]
host = "127.0.0.1"
port = 5000

[online.server]
buffer_dir = "/path/to/buffer"
drain_dir = "/path/to/drain"
sample_reuse_rate = 0
sample_reuse_threshold = 0
capacity = 1600
force_sequential = false

[train_play.default]
games = 800
log_dir = "runs/train_play"
boltzmann_epsilon = 0.005
boltzmann_temp = 0.05
top_p = 1.0
repeats = 1

[baseline.train]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[baseline.test]
device = "cuda:0"
enable_compile = false
state_file = "checkpoints/mortal_step_000200000.pth"

[1v3]
seed_key = -1
games_per_iter = 2000
iters = 500
log_dir = "runs/s6a_smoke/ladder"

[1v3.challenger]
device = "cuda:0"
name = "mortal"
state_file = "checkpoints/s6a_smoke/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.champion]
device = "cuda:0"
name = "baseline"
state_file = "checkpoints/reward_ablation/B_rank_pt_aligned/mortal.pth"
stochastic_latent = false
enable_compile = false
enable_amp = true
enable_rule_based_agari_guard = true

[1v3.akochan]
enabled = false
dir = "/path/to/akochan"
tactics = "/path/to/tactics.json"

[1v3.ladder]
device = "cuda:0"
enable_amp = false
enable_rule_based_agari_guard = true
